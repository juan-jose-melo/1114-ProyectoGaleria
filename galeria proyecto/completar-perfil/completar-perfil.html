<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar Perfil - Galería de Dibujos</title>
    <!-- CSS de la carpeta inicio-Seccion para mantener el estilo -->
    <link rel="stylesheet" href="../inicio-Seccion/iniciar-sesion.css">
</head>
<body>

    <!-- BARRA SUPERIOR -->
    <header class="navbar">
        <a href="../index.html" class="logo-container">
            <div class="logo-icon">🎨</div>
            <span>Galería de Dibujos</span>
        </a>
        <a href="../index.html" class="nav-link-back">← Volver al inicio</a>
    </header>

    <!-- FORMULARIO DE COMPLETAR PERFIL -->
    <main class="main-container">
        <div class="auth-card">
            
            <h1 class="card-title">Configura tu Perfil</h1>
            <p class="card-subtitle">Ingresa tus datos para identificarte en la comunidad</p>

            <!-- Caja para mensajes de alerta -->
            <div id="alert-box" class="alert-message"></div>

            <form id="form-perfil">
                <div class="form-group">
                    <label for="nombre-completo">Nombre Completo</label>
                    <input 
                        type="text" 
                        id="nombre-completo" 
                        class="form-control" 
                        placeholder="Ej: Juan Pérez" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="usuario-tag">Nombre de usuario (@)</label>
                    <input 
                        type="text" 
                        id="usuario-tag" 
                        class="form-control" 
                        placeholder="Ej: @juanperez" 
                        required
                    >
                </div>

                <button type="submit" class="btn-submit">Guardar y continuar a mi perfil</button>
            </form>

        </div>
    </main>

    <!-- ARCHIVO JAVASCRIPT -->
    <script src="completar-perfil.js"></script>
</body>
</html>
