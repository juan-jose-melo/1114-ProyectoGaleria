<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Galería de Dibujos</title>
    <link rel="stylesheet" href="perfil.css">
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <header class="navbar">
        <a href="../galeria.html" class="logo-container">
            <div class="logo-icon">🎨</div>
            <span>Galería de Dibujos</span>
        </a>
        <div class="nav-links">
            <a href="../galeria.html" class="btn-nav">Inicio</a>
            <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="perfil-container">
        <!-- TARJETA DE USUARIO -->
        <section class="card-usuario">
            <div class="avatar" id="avatar-letra">U</div>
            <div class="info-usuario">
                <h2 id="perfil-nombre">Cargando...</h2>
                <p id="perfil-tag" class="tag">@cargando</p>
                <p id="perfil-email" class="email">correo@ejemplo.com</p>
            </div>
        </section>

        <!-- SECCIÓN MIS DIBUJOS -->
        <section class="card-mis-dibujos">
            <div class="mis-dibujos-header">
                <h2>Mis Dibujos</h2>
                <button id="btn-subir" class="btn-subir">+ Subir Dibujo</button>
            </div>

            <div id="grid-mis-dibujos" class="drawings-grid">
                <p class="empty-msg">🎨 Aún no has publicado ningún dibujo.<br><small>¡Haz clic en "+ Subir Dibujo" para compartir tu primera creación!</small></p>
            </div>
        </section>
    </main>

    <!-- MODAL VENTANA FLOTANTE PARA SUBIR DIBUJO -->
    <div id="modal-subir" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Subir nuevo dibujo</h3>
            <form id="form-subir-dibujo">
                <input type="text" id="titulo-dibujo" placeholder="Título del dibujo" required class="form-control">
                
                <!-- Selector personalizado para archivos desde el equipo -->
                <label style="font-weight: 600; font-size: 0.85rem; color: #555; display: block; margin-bottom: 6px;">Seleccionar desde tu equipo:</label>
                
                <div class="custom-file-upload">
                    <input type="file" id="file-dibujo" accept="image/*" class="file-input-hidden">
                    <label for="file-dibujo" class="btn-custom-file">
                         Seleccionar Imagen
                    </label>
                    <span id="file-name-display" class="file-name-text">Ningún archivo seleccionado</span>
                </div>

                <div class="divider-text">— O pegar un enlace —</div>

                <!-- Campo para URL opcional -->
                <input type="url" id="url-dibujo" placeholder="URL de la imagen (ej: https://...)" class="form-control">

                <div class="modal-buttons">
                    <button type="submit" class="btn-primary">Publicar</button>
                    <button type="button" id="btn-cancelar" class="btn-cancelar">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="perfil.js"></script>
</body>
</html>
