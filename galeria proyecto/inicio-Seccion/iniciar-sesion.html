<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Dibujos - Iniciar Sesión</title>
    <!-- CSS propio en español -->
    <link rel="stylesheet" href="iniciar-sesion.css">
</head>
<body>

    <!-- Header similar al index -->
    <header class="navbar">
        <a href="index.html" class="logo-container">
            <div class="logo-icon">🎨</div>
            <span>Galería de Dibujos</span>
        </a>
        <a href="../index.html" class="nav-link-back">← Volver al inicio</a>
    </header>

    <!-- Caja de Iniciar Sesión -->
    <main class="main-container">
        <div class="auth-card">
            
            <h1 class="card-title">Iniciar Sesión</h1>
            <p class="card-subtitle">Ingresa tus credenciales para continuar</p>

            <!-- Notificación dinámicas -->
            <div id="alert-box" class="alert-message"></div>

            <form id="form-login">
                <div class="form-group">
                    <label for="login-email">Correo Electrónico</label>
                    <input type="email" id="login-email" class="form-control" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="login-password">Contraseña</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                </div>

                <div class="form-options">
                    <label><input type="checkbox" id="remember-me"> Recordarme</label>
                    <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-submit">Entrar a mi cuenta</button>
            </form>

            <div class="switch-page">
                ¿Aún no tienes cuenta? <a href="registro.html" class="switch-link">Regístrate aquí</a>
            </div>

        </div>
    </main>

    <!-- JS propio en español -->
    <script src="iniciar-sesion.js"></script>
</body>
</html>
